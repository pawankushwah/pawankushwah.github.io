<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilities | Annodiya</title>
    <link rel="stylesheet" href="../index.css">
    <style>
        .utils-hero {
            padding: 4rem 0 4rem;
            text-align: center;
        }
        nav {
            position: static !important;
            transform: none !important;
            background: transparent !important;
            border-bottom: none !important;
            backdrop-filter: none !important;
            margin-bottom: 2rem;
        }
        .utils-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 350px));
            gap: 2rem;
            margin-bottom: 6rem;
            justify-content: center;
        }
        .util-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: var(--text-primary);
        }
        .util-card:hover {
            background: var(--card-hover);
            border-color: var(--primary);
            transform: translateY(-8px);
            box-shadow: 0 10px 30px var(--primary-glow);
        }
        .util-icon {
            width: 64px;
            height: 64px;
            background: rgba(0, 112, 243, 0.1);
            color: var(--primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .util-icon svg {
            width: 32px;
            height: 32px;
        }
        .util-card h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .util-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <nav>
        <div class="container nav-container">
            <a href="../index.html" class="logo" style="text-decoration: none;">
                <img src="../annodiya-logo.png" alt="Logo" class="logo-img">
                <span class="logo-text">nno<span>diya</span></span>
            </a>
            <div class="nav-links">
                <a href="../index.html" style="display: flex; align-items: center; gap: 0.5rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Home
                </a>
            </div>
        </div>
    </nav>

    <main>
        <section class="utils-hero">
            <div class="container">
                <h1 class="gradient-text">Utilities</h1>
                <p style="color: var(--text-secondary); max-width: 600px; margin: 1rem auto 0; font-size: 1.1rem;">
                    A collection of handy tools and mini-applications to streamline daily tasks.
                </p>
            </div>
        </section>

        <section class="container">
            <div class="utils-grid">
                <a href="tiffin-manager/index.html" class="util-card">
                    <div class="util-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <path d="M16 10a4 4 0 0 1-8 0"></path>
                        </svg>
                    </div>
                    <h3>Tiffin Manager</h3>
                    <p>Track your daily tiffin arrivals, manage monthly records, and export your data securely.</p>
                </a>
            </div>
        </section>
    </main>

    <script>
        const nav = document.querySelector('nav');
        setTimeout(() => nav.classList.add('visible'), 100);

        // Load theme
        const savedTheme = localStorage.getItem('portfolio-theme') || 'system';
        if (savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
</body>
</html>
