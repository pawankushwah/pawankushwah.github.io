<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiffin Manager | Utilities</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="../../tiffin.png">
    <link rel="icon" type="image/png" href="../../tiffin.png">
    <link rel="stylesheet" href="../../index.css">
    <link rel="stylesheet" href="style.css">
    <script>
        const savedTheme = localStorage.getItem('portfolio-theme') || 'system';
        if (savedTheme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    </script>
</head>
<body>
    <!-- Navbar -->
    <nav class="visible">
        <div class="container nav-container">
            <a href="../index.html" class="logo" style="text-decoration: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span class="logo-text" style="font-size: 1.2rem;">Explore More</span>
            </a>
            <div class="nav-links">
                <button id="auth-btn" class="nav-cta" style="background: transparent; border: 1px solid var(--primary); color: var(--text-primary); padding: 0.5rem 1rem; display: flex; align-items: center; gap: 0.5rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="lock-icon">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span id="auth-text">Unlock Settings</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="app-container">
        <div class="container">
            <header class="app-header">
                <div>
                    <h1 class="gradient-text">Tiffin Manager</h1>
                    <p class="subtitle" id="current-month-display">Loading...</p>
                </div>
                <div class="header-actions">
                    <button id="mark-today-btn" class="btn btn-primary" style="padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        Mark Today Arrived
                    </button>
                    <div class="data-actions">
                        <button id="view-toggle-btn" class="icon-btn" title="Toggle Grid/List View" style="width: auto; padding: 0.5rem 1rem; gap: 0.5rem;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="view-icon"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                            <span style="font-size: 0.9rem; font-weight: 500;">View</span>
                        </button>
                        <button id="export-btn" class="icon-btn" title="Export Data" style="width: auto; padding: 0.5rem 1rem; gap: 0.5rem;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            <span style="font-size: 0.9rem; font-weight: 500;">Export</span>
                        </button>
                        <button id="import-btn" class="icon-btn" title="Import Data" style="width: auto; padding: 0.5rem 1rem; gap: 0.5rem;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            <span style="font-size: 0.9rem; font-weight: 500;">Import</span>
                        </button>
                        <input type="file" id="import-file" accept=".json" style="display: none;">
                    </div>
                </div>
            </header>

            <!-- Stats Overview -->
            <div class="stats-overview" style="grid-template-columns: repeat(2, 1fr);">
                <div class="stat-card">
                    <div class="stat-label">Arrived</div>
                    <div class="stat-value text-success" id="stat-arrived">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Not Arrived</div>
                    <div class="stat-value text-danger" id="stat-not-arrived">0</div>
                </div>
            </div>

            <!-- Month Controls -->
            <div class="month-controls">
                <button id="prev-month" class="icon-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                <h2 id="calendar-title">Month Year</h2>
                <button id="next-month" class="icon-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
            </div>

            <!-- Calendar List View -->
            <div class="days-list" id="days-list">
                <!-- Dynamically populated by JS -->
            </div>
        </div>
    </main>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay"></div>

    <!-- Auth Modal (Set Passcode / Unlock) -->
    <div id="auth-modal" class="modal">
        <div class="modal-header">
            <h3 id="auth-modal-title">Enter Passcode</h3>
            <button class="close-modal"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="modal-body">
            <p id="auth-modal-desc" style="margin-bottom: 1rem; color: var(--text-secondary);">Please enter your 4-digit passcode.</p>
            <div class="pin-inputs">
                <input type="password" class="pin-box" maxlength="1" data-index="0" autofocus>
                <input type="password" class="pin-box" maxlength="1" data-index="1">
                <input type="password" class="pin-box" maxlength="1" data-index="2">
                <input type="password" class="pin-box" maxlength="1" data-index="3">
            </div>
            <p id="auth-error" class="text-danger" style="display: none; margin-top: 1rem; font-size: 0.9rem;">Incorrect passcode.</p>
        </div>
    </div>

    <!-- Edit Day Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-header">
            <h3 id="edit-modal-title">Edit Day</h3>
            <button class="close-modal"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="modal-body">
            <form id="edit-form">
                <input type="hidden" id="edit-date-key">
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label>Status</label>
                    <div class="status-toggle-group">
                        <label class="status-radio">
                            <input type="radio" name="status" value="pending" checked>
                            <span class="radio-btn pending">Pending</span>
                        </label>
                        <label class="status-radio">
                            <input type="radio" name="status" value="arrived">
                            <span class="radio-btn arrived">Arrived</span>
                        </label>
                        <label class="status-radio">
                            <input type="radio" name="status" value="not-arrived">
                            <span class="radio-btn not-arrived">Not Arrived</span>
                        </label>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="edit-desc">Description</label>
                    <input type="text" id="edit-desc" class="modal-input" placeholder="E.g., Extra chapati, special thali...">
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="edit-tags">Tags (comma separated)</label>
                    <input type="text" id="edit-tags" class="modal-input" placeholder="Spicy, Late, etc.">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Data saved successfully</div>

    <script src="app.js"></script>
</body>
</html>
