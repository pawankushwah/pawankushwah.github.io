<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAANG Role Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <div class="header-left">
                <a href="../index.html" class="back-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Back to Utils
                </a>
                <h1>MAANG Role Tracker</h1>
            </div>
            <div class="header-actions">
                <button id="importBtn" class="btn btn-secondary">Import JSON</button>
                <input type="file" id="fileInput" accept=".json" style="display: none;">
                <button id="exportBtn" class="btn btn-secondary">Export JSON</button>
                <button id="addRoleBtn" class="btn btn-primary">Add New Role</button>
            </div>
        </div>
    </header>

    <main class="app-main">
        <!-- Funnel Overview -->
        <section class="funnel-section">
            <h2>Funnel Overview</h2>
            <div class="funnel-container" id="funnelContainer">
                <!-- Funnel items generated by JS -->
            </div>
        </section>

        <!-- Kanban Board -->
        <section class="kanban-board">
            <div class="kanban-column" data-column="found">
                <div class="column-header">
                    <h3>Roles Found</h3>
                    <span class="count" id="count-found">0</span>
                </div>
                <div class="column-content" id="col-found"></div>
            </div>

            <div class="kanban-column" data-column="referral">
                <div class="column-header">
                    <h3>Referral Requested</h3>
                    <span class="count" id="count-referral">0</span>
                </div>
                <div class="column-content" id="col-referral"></div>
            </div>

            <div class="kanban-column" data-column="applied">
                <div class="column-header">
                    <h3>Applied</h3>
                    <span class="count" id="count-applied">0</span>
                </div>
                <div class="column-content" id="col-applied"></div>
            </div>

            <div class="kanban-column" data-column="interviewing">
                <div class="column-header">
                    <h3>Interviewing</h3>
                    <span class="count" id="count-interviewing">0</span>
                </div>
                <div class="column-content" id="col-interviewing"></div>
            </div>

            <div class="kanban-column" data-column="rejected">
                <div class="column-header">
                    <h3>Rejected</h3>
                    <span class="count" id="count-rejected">0</span>
                </div>
                <div class="column-content" id="col-rejected"></div>
            </div>
        </section>
    </main>

    <!-- Add Role Modal -->
    <div id="addRoleModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Role</h2>
                <button class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="addRoleForm">
                    <div class="form-group">
                        <label for="companyName">Company (MAANG)</label>
                        <input type="text" id="companyName" required placeholder="e.g. Google, Amazon...">
                    </div>
                    <div class="form-group">
                        <label for="roleTitle">Role Title</label>
                        <input type="text" id="roleTitle" required placeholder="e.g. Frontend Engineer">
                    </div>
                    <div class="form-group">
                        <label for="roleLink">Job Link</label>
                        <input type="url" id="roleLink" placeholder="https://careers.google.com/...">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary close-modal-btn">Cancel</button>
                        <button type="submit" class="btn btn-primary">Add Role</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
