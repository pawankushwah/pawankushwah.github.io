<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Work Tracker | Annodiya</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="../../images/work-tracker-logo.png">
    <link rel="icon" type="image/png" href="../../images/work-tracker-logo.png">
    <link rel="stylesheet" href="../../index.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <a href="../index.html" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <h1>Work Tracker</h1>
        </header>

        <main>
            <div class="status-card glass" id="statusCard">
                <div class="status-indicator"></div>
                <h2 id="statusText">Not Working</h2>
                <div class="timer" id="activeTimer">00:00:00</div>
                <p class="subtitle">Current Session</p>
                
                <button id="toggleBtn" class="action-btn start-btn">
                    <span class="btn-text">Clock In</span>
                    <svg class="btn-icon play-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    <svg class="btn-icon stop-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
                </button>
            </div>

            <div class="summary-card glass">
                <h3>Today's Total</h3>
                <div class="total-time" id="totalTimeToday">0h 0m</div>
            </div>

            <div class="history-section">
                <h3>Today's Sessions</h3>
                <div class="session-list" id="sessionList">
                    <!-- Sessions will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // Load theme
        const savedTheme = localStorage.getItem('portfolio-theme') || 'system';
        if (savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker Registered'))
                .catch(err => console.log('Service Worker Error', err));
        }
    </script>
</body>
</html>
