<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1: Basics & Big-O (Interactive Checklist)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Custom Checkbox Styling */
        .custom-checkbox {
            appearance: none;
            background-color: rgba(30, 41, 59, 0.5);
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.5rem;
            height: 1.5rem;
            border: 2px solid #475569;
            border-radius: 0.35rem;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .custom-checkbox::before {
            content: "";
            width: 0.85em;
            height: 0.85em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .custom-checkbox:checked {
            background-color: #10b981; /* Emerald 500 */
            border-color: #10b981;
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        .task-row {
            transition: all 0.3s ease;
        }
        
        .task-row.completed p {
            color: #64748b;
            text-decoration: line-through;
        }

        .progress-bar-fill {
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-10 text-center">
            <div class="inline-flex items-center justify-center space-x-3 bg-blue-900/30 text-blue-400 px-4 py-2 rounded-full mb-6 border border-blue-500/30">
                <i class="fas fa-users"></i>
                <span class="text-sm font-semibold tracking-wide uppercase">3-Player Co-op</span>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-4">
                Week 1: Basics & Big-O
            </h1>
            <p class="text-slate-400 text-lg max-w-2xl mx-auto">
                To truly conquer Week 1, every member of the trio should be able to check off every box below. If someone is stuck on a concept, the other two must step in to help before the group moves on.
            </p>
        </header>

        <!-- Progress Tracker -->
        <div class="glass-panel rounded-2xl p-6 mb-8 shadow-2xl sticky top-4 z-10 border-t border-white/10">
            <div class="flex justify-between items-end mb-3">
                <div>
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="fas fa-trophy text-yellow-400"></i> Mastery Progress
                    </h2>
                    <p class="text-sm text-slate-400 mt-1" id="progress-text">0 / 0 items completed</p>
                </div>
                <div class="text-3xl font-black text-emerald-400" id="progress-percentage">0%</div>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-4 overflow-hidden border border-slate-700">
                <div class="bg-gradient-to-r from-emerald-600 to-emerald-400 h-full rounded-full progress-bar-fill shadow-[0_0_10px_rgba(16,185,129,0.5)]" id="progress-bar" style="width: 0%"></div>
            </div>
        </div>

        <!-- Checklist Container -->
        <div id="checklist-container" class="space-y-6 pb-20">
            <!-- Sections will be injected here by JS -->
        </div>
    </div>

    <script>
        const LOCAL_STORAGE_KEY = 'dsa_group_week1_progress';

        const checklistData = [
            {
                title: "1. Time & Space Complexity (Big-O)",
                icon: "fa-chart-line",
                color: "text-purple-400",
                items: [
                    { id: "w1_o1", text: "<strong>The Big-O Hierarchy:</strong> I can rank the following from fastest to slowest: O(1), O(log N), O(N), O(N log N), O(N<sup>2</sup>), O(2<sup>N</sup>), O(N!)." },
                    { id: "w1_o2", text: "<strong>Counting Operations:</strong> I can look at a simple <code>for</code> loop and correctly identify if it runs in O(N) or O(N<sup>2</sup>) time." },
                    { id: "w1_o3", text: "<strong>Dropping Constants:</strong> I understand why O(2N) and O(N + 500) both simplify to O(N)." },
                    { id: "w1_o4", text: "<strong>Worst-Case vs. Best-Case:</strong> I can explain the difference between the worst-case and best-case time complexity of finding a specific number in an unsorted array." },
                    { id: "w1_o5", text: "<strong>Auxiliary Space:</strong> I can identify if my algorithm uses O(1) space (in-place) or O(N) space (creating a new array/hash map)." }
                ]
            },
            {
                title: "2. C++ Memory & Static Arrays",
                icon: "fa-microchip",
                color: "text-blue-400",
                items: [
                    { id: "w1_m1", text: "<strong>Contiguous Memory:</strong> I can explain to my group <em>why</em> accessing an array element by index (e.g., <code>arr[5]</code>) takes O(1) time using memory addresses." },
                    { id: "w1_m2", text: "<strong>Stack vs. Heap:</strong> I know the basic difference between stack memory (local variables) and heap memory (dynamic allocation using <code>new</code>)." },
                    { id: "w1_m3", text: "<strong>Out of Bounds:</strong> I understand why C++ does not automatically stop me from accessing <code>arr[10]</code> in an array of size 5, and the dangers of Segmentation Faults." }
                ]
            },
            {
                title: "3. C++ std::vector Mastery",
                icon: "fa-layer-group",
                color: "text-orange-400",
                items: [
                    { id: "w1_v1", text: "<strong>Initialization:</strong> I can declare an empty vector, a vector with 10 elements initialized to 0, and a vector from an initializer list <code>{1, 2, 3}</code>." },
                    { id: "w1_v2", text: "<strong>Core Methods:</strong> I am comfortable using <code>.push_back()</code>, <code>.pop_back()</code>, <code>.size()</code>, and <code>.empty()</code>." },
                    { id: "w1_v3", text: "<strong>Size vs. Capacity:</strong> I can explain to the group what happens under the hood when a vector runs out of capacity (it allocates a new array of double the size and copies elements over)." },
                    { id: "w1_v4", text: "<strong>Amortized Time:</strong> I understand why <code>.push_back()</code> is considered <em>amortized</em> O(1) time despite occasional reallocations." },
                    { id: "w1_v5", text: "<strong>Iteration:</strong> I can loop through a vector using both a traditional <code>for(int i = 0; i < vec.size(); i++)</code> loop and a modern range-based loop <code>for(int num : vec)</code>." }
                ]
            },
            {
                title: "4. Pass by Value vs. Pass by Reference",
                icon: "fa-link",
                color: "text-red-400",
                items: [
                    { id: "w1_r1", text: "<strong>Pass by Value (The Trap):</strong> I know that writing <code>void doSomething(vector&lt;int&gt; nums)</code> creates a full, O(N) copy of the array every time the function is called." },
                    { id: "w1_r2", text: "<strong>Pass by Reference (<code>&amp;</code>):</strong> I know that writing <code>void doSomething(vector&lt;int&gt;&amp; nums)</code> passes the memory address, taking only O(1) time and allowing me to modify the original vector." },
                    { id: "w1_r3", text: "<strong>Const Reference (<code>const &amp;</code>):</strong> I know to use <code>void doSomething(const vector&lt;int&gt;&amp; nums)</code> when I want to read the array without copying it, while guaranteeing I won't accidentally change its contents." }
                ]
            },
            {
                title: "5. Group Milestones for the Week",
                icon: "fa-flag-checkered",
                color: "text-emerald-400",
                items: [
                    { id: "w1_g1", text: "<strong>Problem 1:</strong> Independently solved \"Two Sum\" and identified its Time/Space complexity." },
                    { id: "w1_g2", text: "<strong>Problem 2:</strong> Independently solved \"Contains Duplicate\" and identified its Time/Space complexity." },
                    { id: "w1_g3", text: "<strong>Problem 3:</strong> Independently solved \"Valid Anagram\" and identified its Time/Space complexity." },
                    { id: "w1_g4", text: "<strong>Code Review Session:</strong> We held a session where we checked everyone's solutions specifically looking for missing <code>&amp;</code> references in function parameters." },
                    { id: "w1_g5", text: "<strong>Mock Explanation:</strong> I successfully explained the Time and Space complexity of at least one of my solutions out loud to the group." }
                ]
            }
        ];

        let savedState = {};
        let totalItems = 0;

        function init() {
            // Calculate total items
            checklistData.forEach(section => {
                totalItems += section.items.length;
            });

            // Load saved state from local storage
            try {
                const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (stored) {
                    savedState = JSON.parse(stored);
                }
            } catch (e) {
                console.error("Could not load from localStorage", e);
            }

            renderChecklist();
            updateProgress();
        }

        function renderChecklist() {
            const container = document.getElementById('checklist-container');
            container.innerHTML = ''; // Clear existing

            checklistData.forEach(section => {
                const sectionEl = document.createElement('div');
                sectionEl.className = 'glass-panel rounded-2xl overflow-hidden shadow-lg';
                
                // Section Header
                const headerHtml = `
                    <div class="bg-slate-800/80 px-6 py-4 border-b border-slate-700/50">
                        <h3 class="text-xl font-bold text-white flex items-center gap-3">
                            <i class="fas ${section.icon} ${section.color}"></i>
                            ${section.title}
                        </h3>
                    </div>
                `;
                
                // Section Items
                let itemsHtml = '<div class="divide-y divide-slate-700/30">';
                section.items.forEach(item => {
                    const isChecked = savedState[item.id] ? 'checked' : '';
                    const completedClass = isChecked ? 'completed' : '';
                    
                    itemsHtml += `
                        <label class="task-row flex items-start gap-4 p-5 hover:bg-slate-800/40 cursor-pointer ${completedClass}" id="row-${item.id}">
                            <div class="pt-1 flex-shrink-0">
                                <input type="checkbox" class="custom-checkbox" id="${item.id}" ${isChecked} onchange="toggleItem('${item.id}')">
                            </div>
                            <div class="flex-1">
                                <p class="text-slate-200 leading-relaxed text-[15px] transition-colors duration-200" id="text-${item.id}">
                                    ${item.text}
                                </p>
                            </div>
                        </label>
                    `;
                });
                itemsHtml += '</div>';

                sectionEl.innerHTML = headerHtml + itemsHtml;
                container.appendChild(sectionEl);
            });
        }

        function toggleItem(id) {
            const checkbox = document.getElementById(id);
            const row = document.getElementById(`row-${id}`);
            
            // Update state
            savedState[id] = checkbox.checked;
            
            // Update UI styling
            if (checkbox.checked) {
                row.classList.add('completed');
            } else {
                row.classList.remove('completed');
            }
            
            // Save to local storage
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(savedState));
            } catch (e) {
                console.error("Could not save to localStorage", e);
            }
            
            updateProgress();
        }

        function updateProgress() {
            // Count checked items
            let checkedCount = 0;
            checklistData.forEach(section => {
                section.items.forEach(item => {
                    if (savedState[item.id]) {
                        checkedCount++;
                    }
                });
            });

            const percentage = totalItems === 0 ? 0 : Math.round((checkedCount / totalItems) * 100);
            
            // Update UI
            document.getElementById('progress-text').innerText = `${checkedCount} / ${totalItems} items completed`;
            document.getElementById('progress-percentage').innerText = `${percentage}%`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;

            // If 100%, maybe add a little celebration class (optional)
            const percentageEl = document.getElementById('progress-percentage');
            if(percentage === 100) {
                percentageEl.classList.add('animate-pulse');
            } else {
                percentageEl.classList.remove('animate-pulse');
            }
        }

        // Initialize the app when DOM is ready
        window.onload = init;
    </script>
</body>
</html>
